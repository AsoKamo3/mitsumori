<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>見積プロトタイプ</title>
</head>
<body>
  <h1>見積プロトタイプ（CSVマスター版）</h1>

  <table border="1" id="lines">
    <thead>
      <tr>
        <th>科目</th>        <!-- 大項目：01 映像企画関連費 など -->
        <th>費目コード</th>  <!-- 小項目コード：10, 20, 50 など -->
        <th>費目</th>        <!-- 小項目名：企画関連制作管理, アートディレクター費 など -->
        <th>摘要</th>        <!-- 摘要（detail_name：担当＋内容など） -->
        <th>コード</th>      <!-- 01-50-01 などの管理コード -->
        <th>単価</th>
        <th>数量</th>
        <th>単位</th>        <!-- 式, 日, 時, 本, 台, 人, ... 　-->
        <th>金額</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <!-- 科目：01 映像企画関連費 など -->
        <td><select class="major"></select></td>

        <!-- 費目コード：10, 20, 50 など（番号のみ選択） -->
        <td><select class="sub-code"></select></td>

        <!-- 費目：企画関連制作管理, アートディレクター費 など（自動表示） -->
        <td><input class="sub-name" readonly></td>

        <!-- 摘要：アートディレクター 上田豪 / 撮影用クレーン Dolly など -->
        <td><select class="detail"></select></td>

        <!-- 管理コード：01-50-01 など -->
        <td><input class="code" readonly></td>

        <!-- 単価 -->
        <td><input class="unit-price" readonly></td>

        <!-- 数量 -->
        <td><input class="qty" type="number" value="1" min="1"></td>

        <!-- 単位 -->
        <td><select class="unit-type"></select></td>

        <!-- 金額 -->
        <td><input class="amount" readonly></td>
      </tr>
    </tbody>
  </table>

  <button id="addRow">行を追加</button>

  <script src="/static/main.js"></script>
</body>
</html>
