<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>見積プロトタイプ</title>
</head>
<body>
  <h1>見積プロトタイプ（CSVマスター版）</h1>

  <table border="1" id="lines">
    <thead>
      <tr>
        <th>科目</th>
        <th>費目コード</th>
        <th>費目</th>
        <th>摘要</th>
        <th>コード</th>
        <th>単価</th>
        <th>数量</th>
        <th>単位</th>
        <th>金額</th>
        <th>削除</th> <!-- ★ 追加 -->
      </tr>
    </thead>
    <tbody>
      <tr>
        <td><select class="major"></select></td>
        <td><select class="sub-code"></select></td>
        <td><input class="sub-name" readonly></td>
        <td><select class="detail"></select></td>
        <td><input class="code" readonly></td>
        <td><input class="unit-price" readonly></td>
        <td><input class="qty" type="number" value="1" min="1"></td>
        <td><select class="unit-type"></select></td>
        <td><input class="amount" readonly></td>
        <td>
          <button type="button" class="delete-row">削除</button> <!-- ★ 追加 -->
        </td>
      </tr>
    </tbody>
  </table>

  <button id="addRow">行を追加</button>

  <!-- ★ 合計表示エリア -->
  <div id="totals" style="margin-top: 1em;">
    <div>小計（税抜）：<span id="subtotal">0</span></div>
    <div>消費税（10%）：<span id="tax">0</span></div>
    <div><strong>合計（税込）：<span id="total">0</span></strong></div>
  </div>

  <script src="/static/main.js"></script>
</body>
</html>
